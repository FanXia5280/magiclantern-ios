name: MagicLantern
options:
  bundleIdPrefix: com.magiclantern
  # 只支持 iOS 27 及以上（原生 Liquid Glass 设计语言）
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    ENABLE_BITCODE: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  MagicLantern:
    type: application
    platform: iOS
    sources:
      - path: MagicLantern
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magiclantern.rgb
        PRODUCT_NAME: MagicLantern
        INFOPLIST_FILE: MagicLantern/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"

schemes:
  MagicLantern:
    build:
      targets:
        MagicLantern: all
    run:
      config: Debug
    archive:
      config: Release
