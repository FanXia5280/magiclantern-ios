name: Build iOS IPA

# 手动点按钮触发（也可以在 push 时自动触发）
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # macos-15 自带 Xcode 16，能读 XcodeGen 生成的新版工程格式
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 显示构建环境（排错用）
        run: |
          xcode-select -p
          xcodebuild -version
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project MagicLantern.xcodeproj \
            -scheme MagicLantern \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        run: |
          set -e
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MagicLantern.app Payload/
          zip -qr MagicLantern-unsigned.ipa Payload
          ls -lh MagicLantern-unsigned.ipa
          echo "打包完成：MagicLantern-unsigned.ipa"

      - name: 上传 IPA（在页面下方 Artifacts 下载）
        uses: actions/upload-artifact@v4
        with:
          name: MagicLantern-ipa
          path: MagicLantern-unsigned.ipa
          retention-days: 30
