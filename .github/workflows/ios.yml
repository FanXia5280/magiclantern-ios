name: Build iOS IPA

# 手动点按钮触发（也可以在 push 时自动触发）
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # xcode-27 镜像：macOS 27 + Xcode 27 + iOS 27 SDK（原生 Liquid Glass）
    runs-on: xcode-27
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 显示构建环境（排错用）
        run: |
          xcode-select -p
          xcodebuild -version
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（未签名）
        id: xcbuild
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project MagicLantern.xcodeproj \
            -scheme MagicLantern \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: 编译错误摘要（失败时显示在日志末尾）
        if: steps.xcbuild.outcome == 'failure'
        run: |
          echo "================ 编译错误摘要 ================"
          grep -n "error:" build.log | head -60 || echo "（未匹配到 error: 行，请看上面的完整日志）"
          echo "=============================================="
          exit 1

      - name: 打包成 IPA
        if: steps.xcbuild.outcome == 'success'
        run: |
          set -e
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MagicLantern.app Payload/
          zip -qr MagicLantern-unsigned.ipa Payload
          ls -lh MagicLantern-unsigned.ipa
          echo "打包完成：MagicLantern-unsigned.ipa"

      - name: 上传 IPA（在页面下方 Artifacts 下载）
        if: steps.xcbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MagicLantern-ipa
          path: MagicLantern-unsigned.ipa
          retention-days: 30
